<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="theme-color" content="#14202b">
<title>Mon planning</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#62717f;--line:#dbe1e7;--hl:#ffe45c;--acc:#1f4e79;--soft:#f5f7f9;--ok:#1d7a4d;
box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media(prefers-color-scheme:dark){:root{--bg:#0e141a;--card:#18212a;--ink:#eef2f5;--mut:#9aa8b5;--line:#2a3643;--acc:#8fc1ee;--soft:#1f2a34;--ok:#5fd29a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:960px;margin:0 auto;padding:18px 14px 44px}
h1{font-size:clamp(22px,6vw,30px);margin:6px 0 2px;letter-spacing:-.02em}
h1 mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.note{color:var(--mut);font-size:14px}
.err{color:#c0392b;font-weight:600}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=date]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
button{display:block;width:100%;font:inherit;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);cursor:pointer}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.5}
.mini{display:inline-block;width:auto;padding:8px 12px;font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:12px;display:none;background:var(--soft)}
summary{cursor:pointer;font-weight:600;padding:2px 0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;width:auto;background:transparent;color:var(--mut);padding:10px}
.tabs button.on{background:var(--ink);color:var(--bg)}

/* Aujourd'hui */
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin-bottom:16px}
@media(prefers-color-scheme:dark){.hero{background:#1d2a36;border:1px solid var(--line)}}
.hero .when b{background:linear-gradient(transparent 58%,#8a7a10 58%);padding:0 3px}
.hero h2{margin:4px 0 12px;font-size:clamp(22px,6vw,28px);text-transform:capitalize}
.status{display:inline-block;background:var(--hl);color:#14202b;font-weight:700;border-radius:999px;padding:5px 12px;font-size:14px;margin-bottom:14px}
.hero .per{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.hero .per.now{background:rgba(255,228,92,.18);border-color:var(--hl)}
.hero .pm,.hero .pl,.hero .pp,.hero .free,.hero .src{color:rgba(255,255,255,.72)}
.hero .tot{margin-top:12px;font-size:15px}
.src{font-size:13px;margin-top:10px}
.arch{border:2px dashed var(--acc)}

/* Périodes */
.periods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:330px){.periods{grid-template-columns:1fr}}
.per{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);min-width:0}
.per.now{border-color:var(--ok)}
.pl{font-size:13px;color:var(--mut);font-weight:600}
.ph{font-size:clamp(17px,4.8vw,21px);font-weight:700;margin:2px 0;white-space:nowrap}
.pm{font-size:13.5px;color:var(--mut)}
.pp{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.free{color:var(--mut);font-weight:600;padding-top:4px}

/* Semaine */
.sec-t{font-size:18px;margin:22px 2px 10px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.day.today{border:2px solid var(--ink);box-shadow:0 0 0 3px var(--hl)}
.day.past{opacity:.55}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.dh strong{text-transform:capitalize}
.dh span{font-size:14px;color:var(--mut);font-weight:600}
.dayoff{color:var(--mut);font-weight:600;padding:4px 0}
.wk{margin-top:12px;font-weight:700}

/* Historique */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;text-align:center}
.bar span{font-size:11.5px;font-weight:600}
.bar i{display:block;width:70%;min-height:3px;background:var(--acc);border-radius:6px 6px 0 0;margin:3px 0}
.bar.cur i{background:var(--hl);outline:2px solid var(--ink)}
.bar small{font-size:11px;color:var(--mut)}
.hrow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.th{width:64px;height:84px;object-fit:cover;border-radius:8px;background:var(--soft);flex:none;border:1px solid var(--line);cursor:zoom-in}
.hi{flex:1;min-width:0}
.hi .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
dialog{width:min(96vw,720px);border:0;border-radius:16px;padding:10px;background:var(--card);color:var(--ink)}
dialog img{width:100%;border-radius:10px;margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>Mon <mark>planning</mark></h1>
<p class="sub" id="sub">Photographie le planning : seuls tes horaires s'affichent.</p>

<nav class="tabs" role="tablist">
  <button id="t1" role="tab" class="on" aria-selected="true">Planning</button>
  <button id="t2" role="tab" aria-selected="false">Historique</button>
</nav>

<section id="pPlan">
  <div id="view"></div>
  <details class="card" id="up">
    <summary id="upT">Ajouter une photo du planning</summary>
    <div style="margin-top:12px">
      <input id="file" type="file" accept="image/*" hidden>
      <button id="pick">Prendre ou choisir une photo</button>
      <img id="preview" alt="Aperçu du planning">
      <button id="go" style="margin-top:12px" disabled>Analyser mon planning</button>
      <div id="msg" class="note" style="margin-top:10px"></div>
    </div>
  </details>
  <details class="card" id="settings">
    <summary>Réglages</summary>
    <div class="row">
      <div><label for="first">Prénom</label><input id="first" type="text" value="Léo" autocomplete="off"></div>
      <div><label for="last">Nom</label><input id="last" type="text" value="Hurel" autocomplete="off"></div>
    </div>
    <label for="key">Clé API OpenAI</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
    <label for="model">Modèle</label>
    <input id="model" type="text" value="gpt-4o" autocomplete="off">
    <button class="sec" id="save" style="margin-top:14px">Enregistrer</button>
    <p class="note">La clé reste sur ton iPhone (stockage local du navigateur) et n'est envoyée qu'à OpenAI.</p>
  </details>
</section>

<section id="pHist" hidden></section>

<dialog id="dlg"><img id="big" alt="Photo du planning analysé"><button class="sec" data-act="close">Fermer</button></dialog>
<input id="imp" type="file" accept="application/json,.json" hidden>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
             set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } } };
let imageData = null, hist = [], viewId = null, dqVal = "";
const MAX = 40;

/* ---------- Réglages ---------- */
["first","last","key","model"].forEach(k => { const v = LS.get("pl_"+k); if (v) $(k).value = v; });
if (!$("key").value) $("settings").open = true;
$("save").onclick = () => { ["first","last","key","model"].forEach(k => LS.set("pl_"+k, $(k).value.trim())); $("settings").open = false; };

/* ---------- Utilitaires ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toMin = t => { const m = /^(\d{1,2})[:h](\d{2})?$/.exec(String(t||"").trim()); return m ? (+m[1])*60 + (+(m[2]||0)) : null; };
const fmtDur = m => { const h = Math.floor(m/60), r = Math.round(m%60); return h + "h" + (r ? String(r).padStart(2,"0") : ""); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const clean = t => { const m = toMin(t); return m == null ? "?" : String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const fd = s => new Date(s.length === 10 ? s + "T12:00" : s).toLocaleDateString("fr-FR", { day:"numeric", month:"short" });
const fdt = s => new Date(s).toLocaleString("fr-FR", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
const monday = s => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const WD = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

const net = p => { if (!p) return 0; const a = toMin(p.debut), b = toMin(p.fin); return (a == null || b == null || b <= a) ? 0 : b - a - (+p.pause_min || 0); };
const dayNet = d => net(d.matin) + net(d.apres_midi);
const weekNet = e => (e.jours || []).reduce((s, j) => s + dayNet(j), 0);
const label = e => e.periode || ("Planning du " + fd(e.saved));

/* ---------- Historique (stockage) ---------- */
function loadHist(){
  try { hist = JSON.parse(LS.get("pl_hist")) || []; } catch(e){ hist = []; }
  if (!hist.length){            // migration de l'ancienne version (un seul planning)
    try { const o = JSON.parse(LS.get("pl_data")); if (o && o.trouve) hist = [{ id: uid(), saved: o.saved || new Date().toISOString(), periode: o.periode, jours: o.jours, doute: o.doute }]; } catch(e){}
  }
}
function saveHist(){
  hist.length = Math.min(hist.length, MAX);
  let n = 0;
  while (!LS.set("pl_hist", JSON.stringify(hist)) && n++ < 80){   // stockage plein : on retire d'abord les miniatures les plus anciennes
    const i = hist.map(e => !!e.thumb).lastIndexOf(true);
    if (i >= 0) delete hist[i].thumb; else if (hist.length > 1) hist.pop(); else break;
  }
}
function buildIdx(){            // date -> {d: jour, e: analyse}, la plus récente l'emporte
  const idx = {};
  [...hist].reverse().forEach(e => (e.jours || []).forEach(j => { if (j.date) idx[j.date] = { d: j, e }; }));
  return idx;
}
function findToday(now, idx){
  const t = iso(now); if (idx[t]) return idx[t];
  const e = hist[0];
  if (e && !(e.jours || []).some(j => j.date)){ const d = e.jours.find(j => norm(j.jour) === WD[now.getDay()]); if (d) return { d, e }; }
  return null;
}

/* ---------- Rendu : composants ---------- */
function period(lbl, p, nowMin){
  if (!p || (!p.debut && !p.fin)) return `<div class="per"><div class="pl">${lbl}</div><div class="free">Libre</div></div>`;
  const a = toMin(p.debut), b = toMin(p.fin);
  const on = nowMin != null && a != null && b != null && nowMin >= a && nowMin < b;
  const pause = p.pause_min == null ? "Pause non indiquée" : (+p.pause_min ? "Pause " + (+p.pause_min) + " min" : "Sans pause");
  const n = net(p);
  return `<div class="per${on ? " now" : ""}"><div class="pl">${lbl}${on ? " · en cours" : ""}</div>
    <div class="ph">${clean(p.debut)} – ${clean(p.fin)}</div>
    <div class="pm">${pause}${n ? " · " + fmtDur(n) + " net" : ""}</div>
    ${p.poste ? `<div class="pp">${esc(p.poste)}</div>` : ""}${p.note ? `<div class="pp">${esc(p.note)}</div>` : ""}</div>`;
}
function dayCard(j, isT, past, nowMin){
  const tot = dayNet(j), dd = j.date ? " " + fd(j.date) : "";
  return `<article class="day${isT ? " today" : ""}${past ? " past" : ""}"><div class="dh"><strong>${esc(j.jour)}${esc(dd)}</strong><span>${!j.repos && tot ? fmtDur(tot) : ""}</span></div>` +
    (j.repos ? `<div class="dayoff">${esc(j.motif || "Repos")}</div>`
             : `<div class="periods">${period("Matin", j.matin, isT ? nowMin : null)}${period("Après-midi", j.apres_midi, isT ? nowMin : null)}</div>`) + `</article>`;
}
function statusOf(d, nowMin){
  if (d.repos) return esc(d.motif || "Repos");
  const ps = [["Matin", d.matin], ["Après-midi", d.apres_midi]].filter(([,p]) => p && toMin(p.debut) != null && toMin(p.fin) != null);
  if (!ps.length) return "Rien de prévu";
  for (const [l,p] of ps) if (nowMin >= toMin(p.debut) && nowMin < toMin(p.fin)) return `${l} en cours, jusqu'à ${clean(p.fin)}`;
  for (const [l,p] of ps) if (nowMin < toMin(p.debut)) return `Prochain : ${l.toLowerCase()} à ${clean(p.debut)}`;
  return "Journée terminée";
}

/* ---------- Rendu : onglet Planning ---------- */
function renderPlan(){
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes(), t = iso(now), idx = buildIdx();
  const arch = viewId && hist.find(e => e.id === viewId);
  const hit = arch ? null : findToday(now, idx);
  const e = arch || (hit && hit.e) || hist[0];
  if (!e){ $("view").innerHTML = ""; $("up").open = true; $("sub").textContent = "Photographie le planning : seuls tes horaires s'affichent."; return; }
  let h = "";
  if (arch){
    h += `<div class="card arch"><b>Archive</b> : ${esc(label(e))}<div class="note">Analysée le ${esc(fdt(e.saved))}</div><button class="sec mini" data-act="back" style="margin-top:8px">Revenir à aujourd'hui</button></div>`;
  } else {
    const dateTxt = now.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
    h += `<section class="hero"><div class="when"><b>Aujourd'hui</b></div><h2>${esc(dateTxt)}</h2>`;
    if (hit){
      const d = hit.d;
      h += `<div class="status">${statusOf(d, nowMin)}</div>`;
      if (!d.repos) h += `<div class="periods">${period("Matin", d.matin, nowMin)}${period("Après-midi", d.apres_midi, nowMin)}</div>` +
        (dayNet(d) ? `<div class="tot">Total du jour : <b>${fmtDur(dayNet(d))}</b> de travail</div>` : "");
      h += `<div class="src">Source : photo analysée le ${esc(fdt(hit.e.saved))}</div>`;
    } else {
      h += `<div class="status">Pas dans l'historique</div><p class="src" style="margin:0">Dernier planning enregistré : ${esc(label(e))}. Ajoute la photo de la semaine en cours.</p>`;
    }
    h += `</section>`;
  }
  const jours = e.jours || [];
  if (jours.length){
    h += `<h2 class="sec-t">${esc(label(e))}</h2><div class="days">` +
      jours.map(j => dayCard(j, !arch && hit && j === hit.d, !arch && j.date && j.date < t, nowMin)).join("") +
      `</div><p class="wk">Total de la semaine : ${fmtDur(weekNet(e))}</p>`;
  }
  if (e.doute) h += `<p class="note">À vérifier : ${esc(e.doute)}</p>`;
  $("view").innerHTML = h;
  $("sub").textContent = "Dernière analyse le " + fdt(hist[0].saved);
  $("upT").textContent = "Nouvelle photo du planning";
}

/* ---------- Rendu : onglet Historique ---------- */
function renderHist(){
  const now = new Date(), t = iso(now), idx = buildIdx();
  if (!hist.length){ $("pHist").innerHTML = `<div class="card"><p>Aucune analyse pour l'instant.</p><p class="note">Chaque photo analysée est conservée ici, avec ses horaires, sa miniature et sa date d'analyse.</p><button class="sec mini" data-act="imp">Importer une sauvegarde</button></div>`; return; }
  const weeks = {}, months = {};
  Object.entries(idx).forEach(([dt, { d }]) => { const n = dayNet(d), w = monday(dt), m = dt.slice(0,7); weeks[w] = (weeks[w]||0) + n; months[m] = (months[m]||0) + n; });
  const tw = monday(t), tm = t.slice(0,7);
  const pm = (() => { const d = new Date(now.getFullYear(), now.getMonth()-1, 1); return iso(d).slice(0,7); })();
  const keys = Object.keys(weeks).sort().slice(-8), max = Math.max(1, ...keys.map(k => weeks[k]));
  let h = `<div class="card"><div class="stats">
    <div class="stat"><b>${fmtDur(weeks[tw]||0)}</b><span class="note">Cette semaine</span></div>
    <div class="stat"><b>${fmtDur(months[tm]||0)}</b><span class="note">Ce mois-ci</span></div>
    <div class="stat"><b>${fmtDur(months[pm]||0)}</b><span class="note">Mois précédent</span></div>
    <div class="stat"><b>${Object.keys(idx).filter(k => !idx[k].d.repos && dayNet(idx[k].d) > 0).length}</b><span class="note">Jours travaillés suivis</span></div></div>`;
  if (keys.length) h += `<div class="note" style="margin-bottom:6px">Heures nettes par semaine</div><div class="bars">` +
    keys.map(k => `<div class="bar${k === tw ? " cur" : ""}"><span>${fmtDur(weeks[k])}</span><i style="height:${Math.round(weeks[k]/max*90)}px"></i><small>${esc(fd(k))}</small></div>`).join("") + `</div>`;
  h += `</div>`;

  h += `<div class="card"><label for="dq" style="margin-top:0">Retrouver un jour précis</label><input id="dq" type="date" value="${esc(dqVal)}">`;
  if (dqVal){
    const x = idx[dqVal];
    h += x ? `<div style="margin-top:12px">${dayCard(x.d, dqVal === t, false, null)}<p class="note">Source : ${esc(label(x.e))}, analysée le ${esc(fdt(x.e.saved))}</p></div>`
           : `<p class="note" style="margin-top:12px">Aucun horaire enregistré pour cette date.</p>`;
  }
  h += `</div><div class="card"><div class="note" style="margin-bottom:4px">Analyses enregistrées (${hist.length}, ${MAX} max)</div>` +
    hist.map(e => `<div class="hrow">${e.thumb ? `<img class="th" src="${e.thumb}" alt="Photo du planning" data-act="photo" data-id="${e.id}">` : `<div class="th"></div>`}
      <div class="hi"><strong>${esc(label(e))}</strong>
      <div class="note">Analysée le ${esc(fdt(e.saved))}${e.model ? " · " + esc(e.model) : ""}</div>
      <div class="note">${weekNet(e) ? "Total " + fmtDur(weekNet(e)) + " · " : ""}${(e.jours||[]).filter(j => !j.repos).length} jours travaillés</div>
      <div class="btns"><button class="mini" data-act="open" data-id="${e.id}">Ouvrir</button><button class="mini sec" data-act="del" data-id="${e.id}">Supprimer</button></div></div></div>`).join("") + `</div>
    <div class="card"><div class="note" style="margin-bottom:8px">Sauvegarde (l'historique reste sur cet appareil)</div>
    <div class="row"><button class="sec mini" data-act="exp" style="flex:1">Exporter</button><button class="sec mini" data-act="imp" style="flex:1">Importer</button></div></div>`;
  $("pHist").innerHTML = h;
}

function renderAll(){ renderPlan(); renderHist(); }
function setTab(n){
  $("pPlan").hidden = n !== "plan"; $("pHist").hidden = n !== "hist";
  $("t1").classList.toggle("on", n === "plan"); $("t2").classList.toggle("on", n === "hist");
  $("t1").setAttribute("aria-selected", n === "plan"); $("t2").setAttribute("aria-selected", n === "hist");
  renderAll(); window.scrollTo({ top: 0 });
}
$("t1").onclick = () => { viewId = null; setTab("plan"); };
$("t2").onclick = () => setTab("hist");

/* ---------- Actions (délégation) ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "open"){ viewId = id; setTab("plan"); }
  else if (a === "back"){ viewId = null; renderPlan(); }
  else if (a === "del"){ if (confirm("Supprimer cette analyse de l'historique ?")){ hist = hist.filter(x => x.id !== id); if (viewId === id) viewId = null; saveHist(); renderAll(); } }
  else if (a === "photo"){ const x = hist.find(x => x.id === id); if (x && x.thumb){ $("big").src = x.thumb; $("dlg").showModal(); } }
  else if (a === "close") $("dlg").close();
  else if (a === "exp") exportJson();
  else if (a === "imp") $("imp").click();
});
document.addEventListener("change", e => { if (e.target.id === "dq"){ dqVal = e.target.value; renderHist(); } });

async function exportJson(){
  const blob = new Blob([JSON.stringify({ v: 1, hist })], { type: "application/json" });
  const f = new File([blob], "planning-historique.json", { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [f] })){
    try { await navigator.share({ files: [f] }); return; } catch(err){ if (err.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
}
$("imp").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()), inc = Array.isArray(j) ? j : j.hist;
    if (!Array.isArray(inc)) throw 0;
    const ids = new Set(hist.map(x => x.id));
    inc.filter(x => x && x.id && Array.isArray(x.jours) && !ids.has(x.id)).forEach(x => hist.push(x));
    hist.sort((a, b) => String(b.saved).localeCompare(String(a.saved)));
    saveHist(); renderAll();
  } catch(err){ alert("Fichier de sauvegarde illisible."); }
  e.target.value = "";
};

/* ---------- Photo + analyse OpenAI ---------- */
$("pick").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    imageData = await shrink(f, 2200, .88);
    $("preview").src = imageData; $("preview").style.display = "block";
    $("go").disabled = false; $("msg").textContent = "";
  } catch(err){ $("msg").innerHTML = "<span class='err'>Impossible de lire cette image.</span>"; }
};
function shrink(src, max, q){
  return new Promise((res, rej) => {
    const isFile = typeof src !== "string", img = new Image(), url = isFile ? URL.createObjectURL(src) : src;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      if (isFile) URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = url;
  });
}

$("go").onclick = async () => {
  const key = $("key").value.trim(), first = $("first").value.trim(), last = $("last").value.trim(), model = $("model").value.trim() || "gpt-4o";
  if (!key){ $("settings").open = true; $("msg").innerHTML = "<span class='err'>Ajoute ta clé API OpenAI dans les réglages.</span>"; return; }
  LS.set("pl_key", key);
  $("go").disabled = true; $("msg").textContent = "Analyse en cours, ça peut prendre 20 secondes…";

  const prompt = `Nous sommes le ${iso(new Date())}. Tu lis la photo d'un planning de travail partagé par plusieurs personnes.
Structure du planning : chaque jour a 2 colonnes, « matin » et « après-midi ».
Trouve UNIQUEMENT la ligne (ou colonne) de la personne « ${first} ${last} » (accepte les variantes : « ${last} ${first} », « ${first} ${last.charAt(0)}. », « ${first} », « ${last} », avec ou sans accents, majuscules ou abréviations). Ignore tous les autres.
Pour CHAQUE jour du planning (repos compris, dans l'ordre), donne ses horaires du matin et de l'après-midi.
Pour chaque période, indique le temps de pause en minutes (« pause_min »). Si la pause est écrite sous forme d'heures (ex : pause de 12h00 à 12h30), convertis en minutes. Si aucune pause n'est indiquée, mets null.
Déduis la date complète « date » au format AAAA-MM-JJ à partir des en-têtes du planning (l'année la plus plausible par rapport à la date du jour). Si impossible, mets null.
Réponds uniquement avec un JSON de ce format :
{"trouve": true|false,
 "periode": "ex : semaine du 5 au 11 octobre",
 "jours": [{"jour": "lundi", "date": "AAAA-MM-JJ ou null", "repos": true|false, "motif": "repos, congé, absence… ou null",
   "matin": {"debut": "HH:MM", "fin": "HH:MM", "pause_min": nombre ou null, "poste": "poste/lieu/code ou null", "note": "précision ou null"} ou null,
   "apres_midi": {même format} ou null}],
 "doute": "ce qui est illisible ou incertain, sinon null"}
Si le nom n'apparaît pas, mets "trouve": false et explique dans "doute". N'invente rien : si une case est illisible, dis-le dans "doute".`;

  try {
    const r = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, response_format: { type: "json_object" },
        messages: [{ role: "user", content: [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: imageData, detail: "high" } }] }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ("Erreur " + r.status));
    const d = JSON.parse(j.choices[0].message.content);
    if (!d.trouve){ $("msg").innerHTML = "<span class='err'>Ton nom n'a pas été trouvé.</span><br>" + esc(d.doute || "Essaie une photo plus nette et bien cadrée."); $("go").disabled = false; return; }
    let thumb = null; try { thumb = await shrink(imageData, 640, .55); } catch(e){}
    hist.unshift({ id: uid(), saved: new Date().toISOString(), model, periode: d.periode, jours: d.jours || [], doute: d.doute, thumb });
    saveHist(); viewId = null;
    $("msg").textContent = ""; $("up").open = false; $("preview").style.display = "none";
    setTab("plan");
  } catch(err){
    $("msg").innerHTML = "<span class='err'>" + esc(err.message) + "</span><br>Vérifie ta clé API, ton crédit OpenAI et ta connexion.";
    $("go").disabled = false;
  }
};

/* ---------- Démarrage + mise à jour automatique ---------- */
loadHist(); renderAll();
if (!hist.length) $("up").open = true;
setInterval(renderAll, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderAll(); });
</script>
